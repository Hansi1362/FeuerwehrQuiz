<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141211">
<title>Quiz</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100dvh; height: auto; }
  header { display: flex; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; color: var(--muted); font-weight: 700; font-size: .95rem; }
  header b { color: var(--fg); }
  .timer { padding: 0 1rem; }
  main { flex: 1; display: flex; flex-direction: column; padding: 1rem; gap: 1rem; max-width: 560px; width: 100%; margin: 0 auto; }
  .card { background: var(--bg2); border-radius: var(--radius); padding: 1.4rem; text-align: center; }
  h1 { margin: 0 0 .6rem; font-size: 1.6rem; }
  .qtext { font-size: 1.35rem; font-weight: 700; text-align: center; margin: .4rem 0 .2rem; line-height: 1.25; }
  .hint { color: var(--muted); text-align: center; font-size: .95rem; }
  .big { font-size: 4rem; line-height: 1; }
  .name { width: 100%; padding: 1rem; font-size: 1.2rem; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); margin: 1rem 0; text-align: center; }
  .name:focus { outline: none; border-color: var(--accent); }
  .btn.wide { width: 100%; font-size: 1.2rem; padding: 1rem; }
  .err { color: #ff8a9a; min-height: 1.4em; margin: .2rem 0 0; }

  .answers { flex: 1; display: grid; gap: .8rem; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(90px, 1fr); }
  .answers.two { grid-template-columns: 1fr; }
  .ans { background: var(--oc); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
         font-weight: 800; padding: .6rem; transition: transform .08s, opacity .2s, filter .2s; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .ans .num { font-size: 2.6rem; line-height: 1; }
  .ans .txt { font-size: .95rem; font-weight: 600; opacity: .92; word-break: break-word; }
  .answers.two .ans .num { font-size: 3.4rem; }
  .ans:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .ans:disabled { cursor: default; }
  .ans.lock { opacity: .45; }
  .ans.off { opacity: .3; filter: saturate(.4); }
  .ans.sel { outline: 5px solid #fff; opacity: 1; filter: none; }
  .ans.right { outline: 5px solid #fff; opacity: 1; filter: none; }
  .res-ok { color: #7dffb2; } .res-bad { color: #ff8a9a; }
  .rank { font-size: 2.2rem; font-weight: 800; }
  .card { border-top: 4px solid var(--accent); }
  .brand { justify-content: center; margin-bottom: .6rem; }
  .banner { background: #b34700; text-align: center; padding: .5rem; font-weight: 700; }
</style>
</head>
<body>
<div id="banner" class="banner hidden">⏸ Pausiert</div>
<header id="head" class="hidden"><span id="who"></span><span id="pts"></span></header>
<div id="timer" class="timer hidden"><div class="bar"><i></i></div></div>
<main id="main"></main>
<script src="/static/common.js"></script>
<script src="/static/play.js"></script>
</body>
</html>
