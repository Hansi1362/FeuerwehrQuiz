<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuerwehr-Quiz – Spielbildschirm</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: 1.5rem; padding: .9rem 2rem .4rem; color: var(--muted); font-weight: 600; }
  .topbar .grow { flex: 1; }
  .topbar .ctrl { display: flex; gap: .5rem; opacity: .55; transition: opacity .2s; }
  .topbar .ctrl:hover { opacity: 1; }
  .timer { padding: 0 2rem; }
  #stage { flex: 1; padding: 1rem 3rem 2rem; display: flex; flex-direction: column; min-height: 0; }
  h1 { margin: 0; font-size: clamp(1.8rem, 4.2vw, 4rem); line-height: 1.15; }
  h1.display { font-size: clamp(2.2rem, 5.5vw, 5rem); line-height: 1.05; }
  .center { text-align: center; }

  /* Lobby */
  .lobby { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 3rem; align-items: center; }
  .qrcard { background: #fff; border-radius: 24px; padding: 14px; width: min(36vh, 40vw); min-width: 220px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .qrcard img { width: 100%; display: block; }
  .joininfo { margin-top: 1rem; color: var(--muted); }
  .joininfo b { color: var(--fg); font-size: 1.3rem; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; max-height: 38vh; overflow: auto; align-content: flex-start; }
  .chip { background: var(--bg2); border-left: 4px solid var(--accent); padding: .5rem 1rem; border-radius: 99px; font-weight: 700; animation: pop .3s; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .startrow { display: flex; gap: .8rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }
  .startrow select { background: var(--bg2); border: 1px solid var(--line); padding: .7em 1em; border-radius: 12px; min-width: 16rem; }
  .startrow .btn { font-size: 1.2rem; }

  /* Frage */
  .qhead { display: flex; gap: 2rem; align-items: center; justify-content: space-between; margin: 1rem 0 2rem; }
  .count { flex: none; width: 6.5rem; height: 6.5rem; border-radius: 50%; background: var(--accent); border: 6px solid var(--yellow); display: grid; place-items: center; font-size: 3rem; font-weight: 800; }
  .opts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; min-height: 0; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt { background: var(--oc); border-radius: var(--radius); display: flex; align-items: center; gap: 1.2rem; padding: 1rem 1.6rem;
         font-size: clamp(1.2rem, 2.6vw, 2.6rem); font-weight: 700; position: relative; overflow: hidden; min-height: 5rem; }
  .opt .n { flex: none; width: 2.6em; height: 2.6em; border-radius: 12px; background: rgba(0,0,0,.25); display: grid; place-items: center; }
  .opt.wrong { filter: saturate(.3) brightness(.55); }
  .opt.right { outline: 6px solid #fff; }
  .opt .cnt { margin-left: auto; font-size: .8em; background: rgba(0,0,0,.3); padding: .1em .6em; border-radius: 99px; }
  .status { text-align: center; color: var(--muted); font-size: 1.4rem; margin-top: 1.2rem; min-height: 2rem; }

  /* Ergebnis / Rangliste */
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.5rem; flex: 1; min-height: 0; }
  .cols .opts { grid-template-columns: 1fr; align-content: start; gap: .8rem; }
  .cols .opt { min-height: 4rem; font-size: clamp(1rem, 2vw, 1.8rem); }
  h2 { margin: 0 0 1rem; color: var(--muted); font-size: 1.2rem; text-transform: uppercase; letter-spacing: .08em; }
  .rows { display: flex; flex-direction: column; gap: .6rem; }
  .row { display: grid; grid-template-columns: 2.4rem 11rem 1fr 6rem; gap: .8rem; align-items: center; font-size: 1.4rem; font-weight: 700; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { background: rgba(255,255,255,.08); border-radius: 10px; height: 2.2rem; overflow: hidden; }
  .row .fill { height: 100%; width: 0; background: linear-gradient(90deg, #d6001c, #ff6a13); border-radius: 10px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .row.first .fill { background: linear-gradient(90deg, #ffd400, #fff07a); }
  .row .pt { text-align: right; }
  .row .gain { color: #7dffb2; font-size: .8em; margin-left: .4rem; }
  .row .rk { color: var(--muted); text-align: right; }
  .dim { color: var(--muted); font-weight: 500; margin-top: .6rem; }

  /* Ende */
  .winner { font-size: clamp(2rem, 6vw, 6rem); font-weight: 800; background: linear-gradient(90deg, #ffe27a, #ffb52e); -webkit-background-clip: text; background-clip: text; color: transparent; margin: .2rem 0 1.5rem; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 1rem; height: 34vh; margin-bottom: 1.5rem; }
  .pod { width: min(22vw, 260px); border-radius: 16px 16px 0 0; background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: .8rem; font-weight: 800; font-size: 1.5rem; text-align: center; animation: rise 1s both; }
  .pod small { display: block; color: rgba(0,0,0,.65); font-weight: 600; font-size: 1rem; }
  .pod.p1 { height: 100%; background: linear-gradient(#ffb52e, #a8741b); } .pod.p2 { height: 72%; background: linear-gradient(#b9bfd0, #6b7185); } .pod.p3 { height: 52%; background: linear-gradient(#c98a55, #7a4f2b); }
  @keyframes rise { from { transform: translateY(60%); opacity: 0; } }
  .rest { max-width: 40rem; margin: 0 auto; width: 100%; }

  .overlay { position: fixed; inset: 0; background: rgba(15,8,6,.8); display: grid; place-items: center; font-size: 4rem; font-weight: 800; z-index: 10; backdrop-filter: blur(4px); }
  #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: #b3283d; padding: .7rem 1.2rem; border-radius: 12px; z-index: 20; }
  @media (max-width: 800px) { .lobby { grid-template-columns: 1fr; } .cols { grid-template-columns: 1fr; overflow: auto; } .row { grid-template-columns: 2rem 7rem 1fr 5rem; font-size: 1rem; } }
</style>
</head>
<body>
<div id="top" class="topbar hidden">
  <span id="progress"></span><span id="quizname" class="grow"></span>
  <span class="ctrl">
    <button class="btn ghost small" id="bPause">⏸ Anhalten</button>
    <button class="btn ghost small" id="bSkip">⏭ Weiter</button>
    <button class="btn ghost small" id="bStop">■ Abbrechen</button>
  </span>
</div>
<div id="timer" class="timer hidden"><div class="bar"><i></i></div></div>
<main id="stage"></main>
<div id="pause" class="overlay hidden"><div class="center">⏸ Pausiert<br><button class="btn" id="bResume" style="font-size:1.6rem;margin-top:1.5rem">▶ Fortsetzen</button></div></div>
<div id="toast" class="hidden"></div>
<script src="/static/common.js"></script>
<script src="/static/host.js"></script>
</body>
</html>
